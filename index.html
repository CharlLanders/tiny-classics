<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Classics</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#FFFAFF;--ink:#1E1B18;--acc:#311847;--cell:#FFFAFF;--p1:#3E92CC;--p2:#D8315B;--p3:hsl(95 55% 46%);--p4:hsl(42 88% 54%);--mut:#1E1B18a0;--tint:#311847;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:14px;user-select:none;touch-action:manipulation}
@property --ar{syntax:"<number>";inherits:false;initial-value:1}
#stage{flex:1 0 auto;margin:0;width:100%;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;row-gap:10px}
#gr{align-self:end}#top{align-self:start}
#hd{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#top{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 6px;width:min(100%,520px)}
#new{margin-left:0}
.ic{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px;background:none;border-radius:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ok[hidden]{display:none}
button{font:inherit;color:var(--ink);background:none;border:1.5px solid var(--mut);border-radius:999px;padding:9px 16px;min-height:44px}
.dd{position:relative;flex:none}
#lmenu{position:absolute;z-index:10;top:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:100%;width:max-content;margin:0;padding:6px;list-style:none;background:var(--bg);border:1.5px solid var(--mut);border-radius:22px;box-shadow:0 8px 24px #00000040}
#lmenu li{display:flex;align-items:center;justify-content:flex-start;gap:10px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
#lmenu li.act{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#lmenu li[aria-selected="true"]{background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink);font-weight:700}
button:disabled{opacity:.4}

.d.pv{opacity:.55;outline:3px dashed var(--ink);outline-offset:-3px}
button.sel{background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
button:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
#score{display:flex;gap:2px;align-items:center;height:44px;padding:0 6px;border:1.5px solid var(--mut);border-radius:999px;font-size:16px;flex:none}
#pl,#lpl{display:flex;align-items:center;justify-content:center}
.gi{width:22px;height:22px;background:none;border-radius:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
#score span{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;opacity:.55}
#score span.on{opacity:1;font-weight:700;background:color-mix(in srgb,var(--ink) 10%,transparent)}
#score i{width:12px;height:12px;border-radius:50%}
#score b{min-width:1.2em;text-align:center}
#score span[hidden],#lmenu li[hidden]{display:none}
#score.n4{padding:0 3px;gap:0}#score.n4 span{padding:5px 6px;gap:4px}
#st{width:min(100%,420px);min-height:24px;text-align:center;color:var(--mut);font-size:16px}
.board{width:min(100%,420px,calc((100vh - var(--rsv,220px))*var(--ar)));width:min(100%,420px,calc((100dvh - var(--rsv,220px))*var(--ar)));aspect-ratio:var(--ar);transition:--ar .28s cubic-bezier(.2,.8,.2,1);background:var(--acc);border-radius:16px;padding:8px}
.g{display:grid;gap:4px;width:100%;height:100%;grid-auto-rows:1fr}
.c7{grid-template-columns:repeat(7,1fr);gap:3px}
.c7 .c{border-radius:50%;overflow:visible}
.t3{grid-template-columns:repeat(3,1fr)}
.b7{grid-template-columns:repeat(8,1fr);gap:3px}
.b7 .c{border-radius:6px}
.c.sk{box-shadow:inset 0 0 0 2px var(--ink)}
.ms{position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.3}
.ms.n{animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.r8{grid-template-columns:repeat(8,1fr);gap:2px}
.c{background:var(--cell);border-radius:8px;position:relative;min-width:0;min-height:0;overflow:hidden;line-height:1;display:flex;align-items:center;justify-content:center;font-size:min(16vw,70px);font-weight:700}
.r8 .c{border-radius:4px}
.d{position:absolute;inset:12%;border-radius:50%;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.h::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.3}
.p1{color:var(--p1)}.p2{color:var(--p2)}
.d.p1{background:var(--p1)}.d.p2{background:var(--p2)}
.c.win{background:color-mix(in srgb,var(--p2) 28%,var(--cell))}
.c7 .c.win{box-shadow:inset 0 0 0 3px var(--ink)}
svg{width:100%;height:100%;display:block;background:var(--cell);border-radius:8px}
.hit{stroke:transparent;stroke-width:9;stroke-linecap:round}
.ln{stroke:var(--ink);stroke-opacity:.13;stroke-width:1.6;stroke-linecap:round;pointer-events:none}
.ln.on{stroke-width:2.4;stroke-opacity:1}
button,#score span{transition:background-color .12s,color .12s,opacity .12s,transform .12s cubic-bezier(.2,.8,.2,1)}
button:active{transform:scale(.94)}

.board.in>*{animation:enter .2s cubic-bezier(.2,.8,.2,1) both}
.m{display:block;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.d{z-index:1}
.d.n{animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.d.f{animation:flip .2s cubic-bezier(.2,.8,.2,1)}
.d.dr{animation:drop calc(.12s + var(--f)*.03s) cubic-bezier(.4,0,.8,.6)}
.c.win{animation:win .2s cubic-bezier(.2,.8,.2,1)}
.ln.on{stroke-dasharray:var(--len);animation:draw .12s ease-out}
.mc{grid-template-columns:1fr 1fr;grid-template-rows:1.15fr repeat(6,1fr) 1.15fr;gap:6px}
.mc .c{border-radius:999px;font-size:min(7vw,30px);color:var(--ink);transition:opacity .12s,background-color .12s}
.mc .s{grid-column:1/3;font-size:min(9vw,40px)}
.mc .o1{box-shadow:inset 0 0 0 3px var(--p1)}.mc .o2{box-shadow:inset 0 0 0 3px var(--p2)}
.mc .dim{opacity:.45}
.mc .pl{background:color-mix(in srgb,var(--p1) 25%,var(--cell))}
.mc .o2.pl{background:color-mix(in srgb,var(--p2) 32%,var(--cell))}
.k{display:block}.k.n{animation:pop .15s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:scale(.96)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes flip{50%{transform:rotateY(90deg)}}
@keyframes drop{from{transform:translateY(calc(var(--f)*-131%))}}
@keyframes win{50%{transform:scale(1.08)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#opp{display:flex;align-items:center;gap:6px}
#opp[hidden]{display:none}
#lpick{display:flex;align-items:center;justify-content:center;padding:9px 32px 9px 14px}
#lmenu li.gh{min-height:0;padding:10px 14px 2px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mut);cursor:default;pointer-events:none;background:none}
#mode{padding:9px 20px;display:inline-flex;align-items:center;justify-content:center}
#lpick{display:block;font-weight:600;text-align:center;cursor:pointer;white-space:nowrap;padding:9px 26px 9px 12px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 11px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
#lv:not([hidden]){animation:pop .15s cubic-bezier(.2,.9,.3,1.2)}
#lpick{position:relative;background-image:none}
#lpick::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.75px solid currentColor;border-bottom:1.75px solid currentColor;border-radius:1px;transform:translateY(-70%) rotate(45deg);transition:transform .15s cubic-bezier(.2,.8,.2,1)}
#lpick[aria-expanded="true"]::after{transform:translateY(-30%) rotate(225deg)}
#gr{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
#gv{flex:0 1 auto}
#gpick::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.75px solid currentColor;border-bottom:1.75px solid currentColor;border-radius:1px;transform:translateY(-70%) rotate(45deg);transition:transform .15s cubic-bezier(.2,.8,.2,1)}
#gpick[aria-expanded="true"]::after{transform:translateY(-30%) rotate(225deg)}
#gpick{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer;white-space:nowrap;padding:9px 32px 9px 14px}
#gpl{display:flex}
#gmenu{position:absolute;z-index:10;top:calc(100% + 6px);bottom:auto;left:50%;transform:translateX(-50%);min-width:100%;width:max-content;margin:0;padding:6px;list-style:none;background:var(--bg);border:1.5px solid var(--mut);border-radius:22px;box-shadow:0 8px 24px #00000040}
#gmenu li{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
#gmenu li.act,#gmenu li:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#gmenu li[aria-selected="true"]{background:color-mix(in srgb,var(--ink) 14%,transparent);font-weight:700}
#gpick{position:relative}
/* layout: game menu above and menus below, attached to the board */
#hd{display:contents}
#gr{order:1}#bd{order:2}#top{order:3;width:min(100%,420px)}
#top{position:relative}
#top #ok{order:1;position:static}
#top #st{flex:0 0 100%;width:100%;order:99;min-height:20px}
#lmenu{top:auto;bottom:calc(100% + 6px)}
#lpick::after{transform:translateY(-30%) rotate(225deg)}
#lpick[aria-expanded="true"]::after{transform:translateY(-70%) rotate(45deg)}
/* themes: each one sets the whole palette, including the four player colours */
:root[data-skin="parchment"]{color-scheme:light;--bg:#F1E9D8;--cell:#FAF5E8;--acc:#5B4636;--ink:#2A211A;--mut:#2A211Aa0;--tint:#5B4636;--p1:#2F5D7C;--p2:#9B2D30;--p3:#3E6B45;--p4:#C48A1A;--sw:#9B2D30}
:root[data-skin="graphite"]{color-scheme:dark;--bg:#15171B;--cell:#1F2329;--acc:#3A414C;--ink:#E6E8EB;--mut:#E6E8EBa0;--tint:#3A414C;--p1:#CBD2DC;--p2:#F2A33A;--p3:#3FB6A8;--p4:#E06C75;--sw:#F2A33A}
:root[data-skin="brass"]{color-scheme:dark;--bg:#0B1426;--cell:#12203A;--acc:#1F3560;--ink:#F2EAD3;--mut:#F2EAD3a0;--tint:#1F3560;--p1:#E0B65C;--p2:#8FB8E8;--p3:#8FC9A0;--p4:#E0867A;--sw:#E0B65C}
:root[data-skin="bubblegum"]{color-scheme:light;--bg:#FFE8F4;--cell:#FFFFFF;--acc:#3B1D5A;--ink:#3B1D5A;--mut:#3B1D5Aa0;--tint:#3B1D5A;--p1:#00BFD8;--p2:#FF4D94;--p3:#7ED321;--p4:#FFA400;--sw:#FF4D94}
:root[data-skin="neon"]{color-scheme:dark;--bg:#120A24;--cell:#1C1038;--acc:#3A1C7A;--ink:#F5ECFF;--mut:#F5ECFFa0;--tint:#3A1C7A;--p1:#00F0FF;--p2:#FF2E97;--p3:#B6FF3B;--p4:#FFE600;--sw:#00F0FF}
:root[data-skin="sorbet"]{color-scheme:light;--bg:#FFF4E0;--cell:#FFFFFF;--acc:#14B8A6;--ink:#2B2D42;--mut:#2B2D42a0;--tint:#14B8A6;--p1:#6C5CE7;--p2:#FF7A59;--p3:#F2B100;--p4:#2BA3F0;--sw:#FF7A59}
#gr{position:relative}
.sw{display:block;width:12px;height:12px;border-radius:50%;background:var(--sw);transition:background-color .12s}
.sw.n{animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
#tn,#wn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) translateY(6px) scale(.9);opacity:0;pointer-events:none;z-index:11;max-width:calc(100vw - 32px);padding:8px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;box-shadow:0 4px 16px #00000033;transition:opacity .3s ease-in,transform .3s ease-in}
#tn.on,#wn.on{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity .12s,transform .16s cubic-bezier(.2,.9,.3,1.2)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#wn{display:flex;align-items:center;gap:12px;padding:18px 30px;border-radius:22px;font-size:24px;font-weight:700;z-index:12;box-shadow:0 8px 28px #00000040}
.board.bs{aspect-ratio:auto;display:flex;flex-direction:column;gap:10px}
.board.bs .g{height:auto;aspect-ratio:1;flex:none}
#fl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding:0 0 4px}
#fl .fs{display:flex;gap:2px;transition:opacity .15s}
#fl .fs i{width:10px;height:10px;border-radius:2px;background:var(--cell)}
#fl .fs.x{opacity:.45}
#fl .fs.x i{background:none;box-shadow:inset 0 0 0 1.5px var(--cell)}
.u3{grid-template-columns:repeat(3,1fr);gap:8px}
.ub{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2px;padding:2px;border-radius:8px;min-width:0;min-height:0;transition:box-shadow .15s,background-color .15s}
.ub .c{border-radius:5px;font-size:min(6.2vw,27px)}
.ub.pl{background:color-mix(in srgb,var(--pc) 55%,var(--acc));box-shadow:0 0 0 3px var(--pc)}
.ub.dr .c{opacity:.35}
.ub .c.lm{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 55%,transparent)}
.ub .w{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:8px;background:color-mix(in srgb,var(--cell) 90%,transparent);font-size:min(21vw,90px);font-weight:700;line-height:1;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
#gv{min-width:0}#gpick{max-width:100%}#gnm{overflow:hidden;text-overflow:ellipsis}
#gmenu li.gh{min-height:0;padding:10px 14px 2px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mut);cursor:default;pointer-events:none;background:none}
#gmenu li.gh:first-child{padding-top:4px}
.hp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;background:var(--bg);font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.hp[aria-expanded="true"]{background:color-mix(in srgb,var(--ink) 14%,var(--bg))}
#hl{position:fixed;right:14px;bottom:calc(14px + 36px + 8px + env(safe-area-inset-bottom,0px));z-index:13;width:min(320px,calc(100vw - 28px));max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px);overflow:auto;padding:14px 18px 16px;background:var(--bg);border:1.5px solid var(--mut);border-radius:22px;box-shadow:0 8px 24px #00000040;font-size:15px;line-height:1.45;color:var(--ink);user-select:text}
#hl[hidden]{display:none}
#hl h3{margin:0 0 8px;font-size:16px}
#hl p{margin:0 0 8px}#hl p:last-child{margin-bottom:0}
.mm{grid-template-columns:repeat(4,1fr);gap:6px}
.mm .c{border-radius:10px;transition:background-color .15s}
.mm .c.dn{background:color-mix(in srgb,var(--ink) 16%,var(--cell))}
.mm .c.dn::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--ink);opacity:.2}
.mm .c svg{width:58%;height:58%;background:none;border-radius:0;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
.mm .c.ow{background:color-mix(in srgb,var(--oc) 32%,var(--cell));box-shadow:inset 0 0 0 3px var(--oc)}
#tt{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) translateY(6px) scale(.9);opacity:0;pointer-events:none;z-index:12;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:10px 22px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap;box-shadow:0 8px 28px #00000040;transition:opacity .12s ease-in,transform .12s ease-in}
#tt .wd{width:14px;height:14px}
#tt.on{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity .08s,transform .12s cubic-bezier(.2,.9,.3,1.2)}
#nb{right:auto;left:14px}
#nl{position:fixed;left:14px;bottom:calc(14px + 36px + 8px + env(safe-area-inset-bottom,0px));z-index:13;width:min(300px,calc(100vw - 28px));padding:14px 18px 16px;background:var(--bg);border:1.5px solid var(--mut);border-radius:22px;box-shadow:0 8px 24px #00000040;font-size:15px;line-height:1.45;color:var(--ink)}
#nl.ty{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
#nl[hidden]{display:none}
#nl h3{margin:0 0 10px;font-size:16px}
#nl .nr{display:flex;align-items:center;gap:12px;margin:0 0 8px}
#nl .nr:last-child{margin-bottom:0}
#nl .nr i{width:16px;height:16px;border-radius:50%;flex:none;border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
#nl input{flex:1;min-width:0;min-height:40px;padding:0 14px;border:1.5px solid var(--mut);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
#nl input::placeholder{color:var(--mut)}
#nl input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
#nl .nt{margin:0;color:var(--mut)}
#wn .wd,#tt .wd{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink);flex:none}

/* online play */
#score span.me{box-shadow:inset 0 0 0 1.5px currentColor}
#ol{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:13;width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow:auto;padding:14px 18px 16px;background:var(--bg);border:1.5px solid var(--mut);border-radius:22px;box-shadow:0 8px 24px #00000040;font-size:15px;line-height:1.45;color:var(--ink)}
#ol[hidden]{display:none}
#ol h3{margin:0 0 10px;font-size:16px}
#ol p{margin:0 0 10px}
#ol .nt{color:var(--mut)}
#ol .err{color:var(--p2);font-weight:600}
#ol .row{display:flex;gap:8px;margin:0 0 10px}
#ol input{flex:1;min-width:0;min-height:44px;padding:0 14px;border:1.5px solid var(--mut);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
#ol input::placeholder{color:var(--mut);letter-spacing:normal;font-weight:500}
#ol input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
#ol input.cd{text-transform:uppercase;letter-spacing:.18em;font-weight:700}
#ol .wide{width:100%;margin:0 0 10px}
#ol .pr{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
#ol .or{display:flex;align-items:center;gap:10px;margin:2px 0 10px;color:var(--mut);font-size:13px}
#ol .or::before,#ol .or::after{content:"";flex:1;border-top:1.5px solid color-mix(in srgb,var(--ink) 15%,transparent)}
#ol .code{font-size:34px;font-weight:800;letter-spacing:.2em;text-align:center;margin:0 0 10px;-webkit-user-select:text;user-select:text}
#ol .op{display:flex;align-items:center;gap:10px;min-height:34px}
#ol .op i{width:14px;height:14px;border-radius:50%;flex:none;border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
#ol .op span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ol .op em{font-style:normal;color:var(--mut);font-size:13px}
#ol .ps{margin:0 0 12px}
#ol .lk{border:none;padding:0;min-height:0;text-decoration:underline;color:var(--ink);font-size:14px}
</style>
<script>
try{var k=localStorage.getItem('tc-skin')}catch(e){}
document.documentElement.dataset.skin=['parchment','graphite','brass','bubblegum','neon','sorbet'].indexOf(k)>=0?k:(matchMedia('(prefers-color-scheme:dark)').matches?'graphite':'parchment');
</script>
</head>
<body>
<div id="stage">
<div id="hd">

/* online panel */
const mkE=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function refreshOnline(){if(!ol.hidden)olFill();syncOpp()}
function olFill(){ol.innerHTML='';
 if(net){ol.appendChild(mkE('h3',null,net.host?'You are hosting':'You are online'));
  ol.appendChild(mkE('p','nt','Game code'));ol.appendChild(mkE('div','code',net.code));
  const sb=mkE('button','wide pr','Share invite link');sb.type='button';sb.onclick=shareLink;ol.appendChild(sb);
  const ps=mkE('div','ps'),cnt=others()+1;
  for(let k=1;k<=cnt;k++){const r=mkE('div','op'),d=mkE('i');d.style.background='var(--p'+k+')';r.appendChild(d);r.appendChild(mkE('span',null,N[k]));
   r.appendChild(mkE('em',null,[k==net.me?'You':'',k==1?'Host':''].filter(Boolean).join(' · ')));ps.appendChild(r)}
  ol.appendChild(ps);
  ol.appendChild(mkE('p','nt',cnt<2?'Waiting for players. Until someone joins you can play every side yourself.':
   cnt>2&&!MP[cur]?'This game is for 2, so players 3 and 4 watch. Dots & boxes and Memory match seat everyone.':
   'Anyone can switch games or start a new one. A player joining or leaving restarts the round.'));
  const nb2=mkE('button','lk','Change your name');nb2.type='button';nb2.onclick=()=>setNames(true);ol.appendChild(nb2);
  const lb=mkE('button','wide','Leave online game');lb.type='button';lb.style.marginTop='12px';lb.onclick=()=>leaveOnline();ol.appendChild(lb);return}
 ol.appendChild(mkE('h3',null,'Play online'));
 ol.appendChild(mkE('p','nt','Play on up to 4 devices. One person hosts and shares the code.'));
 const nr=mkE('div','row'),ni=mkE('input');ni.type='text';ni.maxLength=12;ni.placeholder='Your name';ni.value=myName;ni.autocomplete='off';ni.setAttribute('aria-label','Your name');
 ni.oninput=()=>setMyName(ni.value);nr.appendChild(ni);ol.appendChild(nr);
 const hb=mkE('button','wide pr',olBusy?'Connecting…':'Host a game');hb.type='button';hb.disabled=olBusy;hb.onclick=hostCreate;ol.appendChild(hb);
 ol.appendChild(mkE('div','or','or join a game'));
 const jr=mkE('div','row'),ci=mkE('input','cd'),jb=mkE('button',null,'Join');ci.type='text';ci.maxLength=5;ci.placeholder='Code';ci.autocomplete='off';ci.autocapitalize='characters';ci.spellcheck=false;
 ci.setAttribute('aria-label','Game code');ci.value=olFill.code||'';ci.oninput=()=>olFill.code=ci.value;
 ci.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();guestJoin(ci.value)}};jb.type='button';jb.disabled=olBusy;jb.onclick=()=>guestJoin(ci.value);
 jr.appendChild(ci);jr.appendChild(jb);ol.appendChild(jr);
 if(olErr)ol.appendChild(mkE('p','err',olErr))}
function setOnline(o){ol.hidden=!o;lp.setAttribute('aria-expanded',o&&!!net);if(o){olFill();setGM(false);setLM(false);setHelp(false);setNames(false)}}
document.addEventListener('pointerdown',e=>{if(!ol.hidden&&!ol.contains(e.target)&&!lp.contains(e.target)&&!lm.contains(e.target)&&!nl.contains(e.target))setOnline(false)});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!ol.hidden){setOnline(false);lp.focus()}});
applyNames();syncOpp();ttt();
/* invite links open straight into the join flow */
function checkJoin(){const jm=/[#&?]join=([A-Za-z0-9]{5})/.exec(location.hash+'&'+location.search);if(!jm||net)return;
 try{history.replaceState(null,'',location.pathname)}catch(e){}olFill.code=jm[1].toUpperCase();setOnline(true);guestJoin(jm[1])}
checkJoin();addEventListener('hashchange',checkJoin);
</script>
</body>
</html>
